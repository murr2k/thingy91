# Onomondo SoftSIM Configurations
CONFIG_SOFTSIM=y
CONFIG_SOFTSIM_AUTO_INIT=y
CONFIG_SOFTSIM_DEBUG=y
CONFIG_SOFTSIM_STATIC_PROFILE_ENABLE=y
CONFIG_SOFTSIM_STATIC_PROFILE="011208432405021027699802149854370000002384911803205CA22AA180CE1B6DAB8693F12C9964EB0420A3680546ADE394C5E8851BAC6403FA9105201B5CB6F7F4A4DEB2FDAC35019CF3D0E6062073C1E843AF2AB5B3E0401F49AFB9BE2A0808363730320b1035303433393230390a2039343839323232363932363034343232"

# Log Configurations  
CONFIG_DEBUG=y
CONFIG_LOG=y
CONFIG_NRF_MODEM_LOG=y
CONFIG_LOG_BUFFER_SIZE=8000
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=10
CONFIG_LOG_DEFAULT_LEVEL=3

# RTT Logging
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y

# UART Logging for serial output
CONFIG_LOG_BACKEND_UART=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Modem Configurations
CONFIG_NRF_MODEM_LIB=y

# NET Configurations
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# LTE Configurations
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_EDRX_MODULE=y

# AT host library
CONFIG_SERIAL=y
CONFIG_AT_HOST_LIBRARY=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# NVS Configurations
CONFIG_NVS=y
CONFIG_NVS_LOG_LEVEL_ERR=y
CONFIG_PM_PARTITION_SIZE_NVS_STORAGE=0x8000

# Flash Configurations
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Stack and Heap Configurations
CONFIG_MAIN_STACK_SIZE=5000
CONFIG_HEAP_MEM_POOL_SIZE=30000

# TF-M Configurations - Use Onomondo recommended sizes
CONFIG_BUILD_WITH_TFM=y
CONFIG_PM_PARTITION_SIZE_TFM=0x18000
CONFIG_PM_PARTITION_SIZE_TFM_SRAM=0xC000
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_LOG_LEVEL_SILENCE=y

# Reduce the size of TF-M by disabling the PS (as per Onomondo overlay)
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n

# PSA Crypto Configurations
CONFIG_PSA_WANT_ALG_CBC_NO_PADDING=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# Libraries
CONFIG_NEWLIB_LIBC=y

# Disable predefined Thingy91 partition layouts to use custom static partition map
CONFIG_THINGY91_NO_PREDEFINED_LAYOUT=y