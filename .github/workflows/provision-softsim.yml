name: Provision SoftSIM

on:
  workflow_dispatch:
    inputs:
      device_serial:
        description: 'Device Serial Number'
        required: true
        type: string
      device_port:
        description: 'Serial Port (e.g., /dev/ttyACM0)'
        required: false
        default: '/dev/ttyACM0'
        type: string
      activate:
        description: 'Activate SoftSIM after provisioning'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.10'

jobs:
  provision:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyserial cryptography keyring
    
    - name: Create secure profile
      env:
        ONOMONDO_API_KEY: ${{ secrets.ONOMONDO_API_KEY }}
        ONOMONDO_IMSI: ${{ secrets.ONOMONDO_IMSI }}
        ONOMONDO_ICCID: ${{ secrets.ONOMONDO_ICCID }}
        ONOMONDO_KI: ${{ secrets.ONOMONDO_KI }}
        ONOMONDO_OPC: ${{ secrets.ONOMONDO_OPC }}
        SOFTSIM_PROFILE_ID: ${{ secrets.SOFTSIM_PROFILE_ID }}
      run: |
        python -c "
        import json
        import os
        
        profile = {
            'profile_version': '1.0.0',
            'network_provider': 'onomondo',
            'profile_id': os.environ.get('SOFTSIM_PROFILE_ID', 'ONOMONDO_${{ github.event.inputs.device_serial }}'),
            'credentials': {
                'imsi': os.environ['ONOMONDO_IMSI'],
                'iccid': os.environ['ONOMONDO_ICCID'],
                'ki': os.environ['ONOMONDO_KI'],
                'opc': os.environ['ONOMONDO_OPC']
            },
            'network_config': {
                'apn': 'onomondo',
                'preferred_plmn': ['26201', '26202', '31026', '31010'],
                'rat_priority': ['LTE-M', 'NB-IoT']
            }
        }
        
        with open('/tmp/secure_profile.json', 'w') as f:
            json.dump(profile, f)
        
        print('✓ Secure profile created')
        "
    
    - name: Provision device
      run: |
        if [ "${{ github.event.inputs.activate }}" = "true" ]; then
          ACTIVATE_FLAG="--activate"
        else
          ACTIVATE_FLAG=""
        fi
        
        python scripts/provision_softsim.py \
          ${{ github.event.inputs.device_port }} \
          --profile /tmp/secure_profile.json \
          $ACTIVATE_FLAG \
          --verbose
    
    - name: Clean up
      if: always()
      run: |
        rm -f /tmp/secure_profile.json
        echo "✓ Temporary files cleaned up"
    
    - name: Report status
      if: always()
      run: |
        echo "## Provisioning Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Device: ${{ github.event.inputs.device_serial }}" >> $GITHUB_STEP_SUMMARY
        echo "- Port: ${{ github.event.inputs.device_port }}" >> $GITHUB_STEP_SUMMARY
        echo "- Activation: ${{ github.event.inputs.activate }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY