# Updated for NCS v2.9.1 + SoftSIM Phase 2 Integration

manifest:
  version: "0.13"

  defaults:
    remote: ncs

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: onomondo
      url-base: https://github.com/onomondo

  projects:
    # Nordic Connect SDK v2.9.1 components (matching working baseline)
    - name: sdk-nrf
      revision: v2.9.1
      path: nrf
    - name: sdk-zephyr
      revision: v3.7.99-ncs1-1
      path: zephyr  
    - name: sdk-mcuboot
      revision: v2.0.99-ncs6-3
      path: bootloader/mcuboot
    - name: sdk-mbedtls
      revision: v3.5.0-ncs6-2
      path: modules/crypto/mbedtls
    - name: sdk-nrfxlib
      revision: v2.9.1
      path: nrfxlib
    - name: sdk-trusted-firmware-m
      revision: v2.0.0-ncs4-3
      path: modules/tee/tf-m/trusted-firmware-m
    
    # Onomondo SoftSIM integration (Phase 2)
    # Using v5.1.0 which includes NCS v2.9.1 support (commit a393f70)
    - name: nrf-softsim
      remote: onomondo
      revision: v5.1.0
      path: modules/lib/onomondo-softsim

  self:
    path: asset_tracker_v2_source