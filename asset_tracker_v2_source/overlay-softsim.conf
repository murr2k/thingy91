# Simplified SoftSIM Integration for Asset Tracker v2
# Basic configuration without complex dependencies

# Core SoftSIM Configuration (basic)
CONFIG_SOFTSIM=y
CONFIG_SOFTSIM_AUTO_INIT=y

# Memory Configuration (minimum required for SoftSIM)
CONFIG_HEAP_MEM_POOL_SIZE=50000

# NVS Configuration for Profile Storage  
CONFIG_NVS=y