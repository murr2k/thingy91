# SoftSIM Integration Configuration for Asset Tracker v2
# Optimized for production deployment with efficient resource usage

# Core SoftSIM Configuration
CONFIG_SOFTSIM=y
CONFIG_SOFTSIM_AUTO_INIT=y

# SoftSIM Debug and Development Options
# Enable debug during development/testing - disable for production
CONFIG_SOFTSIM_DEBUG=y

# SoftSIM Profile Configuration
# Use external profile provisioning for flexibility
# CONFIG_SOFTSIM_STATIC_PROFILE_ENABLE=n (default)

# Memory Configuration 
# Optimized allocation: Asset Tracker baseline (47,250) + SoftSIM overhead
# Total heap sufficient for both components without waste
CONFIG_HEAP_MEM_POOL_SIZE=45000

# Storage Configuration for Profile Management
CONFIG_NVS=y

# Flash Configuration (ensure SoftSIM dependencies are met)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Logging Configuration for SoftSIM
CONFIG_LOG_MODE_DEFERRED=y

# Additional SoftSIM compatibility configurations
# Ensure TF-M compatibility (required by SoftSIM Kconfig)
# CONFIG_BUILD_WITH_TFM=y (should be enabled in main config)